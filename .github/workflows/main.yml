name: Android Native CI/CD

on:
  push:
    tags:
      - 'v*' # Spustí se při pushnutí tagu (např. v1.0.0)
  workflow_dispatch:

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      # Nativní Android projekty (od verze Gradle 8+) vyžadují Java 17 nebo Java 21
      - name: Nastavení JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Automaticky cachuje Gradle závislosti pro rychlejší příští build

      - name: Udělení práv pro Gradle wrapper
        run: chmod +x ./gradlew

      - name: Kompilace Release APK a AAB
        run: |
          ./gradlew assembleUniversalRelease --no-parallel
          ./gradlew assembleArmeabiRelease --no-parallel
          ./gradlew assembleX86Release --no-parallel
          ./gradlew bundleRelease --no-parallel

      - name: Diagnostika – kde se soubory reálně vygenerovaly
        run: find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \)

      - name: Sesbírání nepodepsaných souborů do jednoho adresáře
        run: |
          mkdir -p unsigned-artifacts
          find app/build/outputs -type f \( -name "*.apk" -o -name "*.aab" \) -exec cp {} unsigned-artifacts/ \;
          ls -l unsigned-artifacts

      - name: Podepsání Release APK a AAB
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: unsigned-artifacts
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Shromáždění všech podepsaných souborů na jedno místo
      - name: Příprava instalačních balíčků
        run: |
          mkdir -p release-artifacts
          IFS=':' read -r -a files <<< "${{ steps.sign_app.outputs.signedReleaseFiles }}"
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              echo "Kopíruji podepsaný soubor: $file"
              cp "$file" release-artifacts/
            fi
          done
          echo "Seznam připravených souborů:"
          ls -l release-artifacts

      # Vytvoří GitHub Release a nahraje tam všechny podepsané balíčky
      - name: Vytvoření GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true # Automaticky vygeneruje changelog z commitů
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
