name: Android Native CI/CD

on:
  push:
    tags:
      - 'v*' # Spustí se při pushnutí tagu (např. v1.0.0)

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      # Nativní Android projekty (od verze Gradle 8+) vyžadují Java 17 nebo Java 21
      - name: Nastavení JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # Automaticky cachuje Gradle závislosti pro rychlejší příští build

      - name: Udělení práv pro Gradle wrapper
        run: chmod +x ./gradlew

      # Spustí čistý build a vygeneruje produkční APK
      - name: Kompilace Release APK
        run: ./gradlew clean assembleRelease

      # Podepsání výsledného APK pomocí tvého keystore souboru
      - name: Podepsání Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
          alias: ${{ secrets.ANDROID_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # Vytvoří GitHub Release a nahraje tam podepsané APK
      - name: Vytvoření GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
          generate_release_notes: true # Automaticky vygeneruje changelog z commitů
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
